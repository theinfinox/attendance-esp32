; PlatformIO Configuration — Simplified Standalone STM32G491RE Attendance Terminal
; Architecture: STM32G491RET6 (170MHz Cortex-M4, 512KB Flash, 112KB SRAM)
; Persistent Storage: Dedicated Internal Flash (64KB: 0x08070000 - 0x0807FFFF)
; MicroSD: Removed completely

[env:standalone_g491re]
platform = ststm32
board = nucleo_g491re
framework = arduino

build_flags =
    -std=gnu++17
    -DLOG_LEVEL=4
    -DARDUINO_ARCH_STM32
    -Wl,--defsym=LD_MAX_SIZE=0x70000
    -I include

build_unflags = -std=gnu++11

monitor_speed = 115200
upload_protocol = stlink
lib_ldf_mode = deep

lib_deps =
    Adafruit PN532 @ ^1.3.3
    olikraus/U8g2 @ ^2.35.7
    bblanchon/ArduinoJson @ ^7.0.4
