; PlatformIO Configuration — IoT RFID Attendance Terminal
; Target: ESP32-WROVER-E | Framework: Arduino | Standard: C++17

[env:esp32dev]
platform = espressif32
board = esp-wrover-kit
framework = arduino

; C++17 standard
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=4
    -DLOG_LEVEL=4
    -I lib/interfaces
    -I lib/shared/models
    -I lib/shared/utils
    -I lib/application
    -I lib/config
    -I lib/platform/esp32/config
    -I lib/platform/esp32/drivers
    -I lib/platform/esp32/repositories

build_unflags = -std=gnu++11

monitor_speed = 115200
upload_speed = 921600

lib_ldf_mode = deep

lib_deps =
    Adafruit PN532 @ ^1.3.3
    miguelbalboa/MFRC522 @ ^1.4.10
    olikraus/U8g2 @ ^2.35.7
    bblanchon/ArduinoJson @ ^7.0.4
    platform
    shared
