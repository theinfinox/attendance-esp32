<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2563eb">
    <meta name="description" content="USB serial attendance manager">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./css/main.css">
    <title>Serial Attendance Manager</title>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
        <div class="brand"><span class="brand-mark">A</span><span>Attendly</span></div>
        <nav class="nav-list">
          <button class="nav-item active" data-page="dashboard"><span>▦</span>Dashboard</button>
          <button class="nav-item" data-page="users"><span>♙</span>Users</button>
          <button class="nav-item" data-page="logs"><span>☷</span>Attendance Logs</button>
          <button class="nav-item" data-page="console"><span>›_</span>Serial Console</button>
          <button class="nav-item" data-page="settings"><span>⚙</span>Settings</button>
          <button class="nav-item" data-page="about"><span>ⓘ</span>About</button>
        </nav>
        <div class="sidebar-footer"><span class="status-dot" id="sidebar-status-dot"></span><span id="sidebar-status">Disconnected</span></div>
      </aside>
      <div class="backdrop" id="backdrop"></div>
      <main class="main-content">
        <header class="topbar">
          <button class="icon-button mobile-only" id="menu-button" aria-label="Open navigation">☰</button>
          <div class="page-title"><h1 id="page-title">Dashboard</h1><p id="page-subtitle">Monitor your attendance device</p></div>
          <div class="topbar-actions">
            <button class="icon-button" id="theme-button" aria-label="Toggle colour theme">☾</button>
            <button class="connect-button" id="connect-button"><span class="status-dot"></span><span>Connect device</span></button>
          </div>
        </header>
        <section id="app-content" class="page-content" aria-live="polite"></section>
      </main>
    </div>
    <div class="toast-region" id="toast-region" aria-live="polite"></div>
    <dialog id="reconnect-dialog" class="modal"><form method="dialog"><h2>Device disconnected</h2><p>The USB serial device is no longer available. Would you like to reconnect?</p><div class="modal-actions"><button value="cancel" class="button secondary">Not now</button><button value="reconnect" class="button primary">Reconnect</button></div></form></dialog>
    <script type="module" src="./js/app.js?v=6.6"></script>
  </body>
</html>
