; PlatformIO Configuration — IoT RFID Attendance Terminal
; Architecture: Decoupled Multi-Platform C++17
; Supported Families: Espressif ESP32 (Classic, S3, C3) & STMicroelectronics STM32 (F4, F7, G4, L4)

; =============================================================================
; 1. ESP32 Family (Wi-Fi + Embedded WebServer + USB Serial + LittleFS)
; =============================================================================

; --- ESP32 Classic (ESP32-WROVER-E / WROOM / DevKit) ---
[env:esp32dev]
platform = espressif32
board = esp-wrover-kit
framework = arduino

build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=4
    -DLOG_LEVEL=4
    -I lib/interfaces
    -I lib/shared/models
    -I lib/shared/utils
    -I lib/application
    -I lib/config
    -I lib/platform/esp32/config
    -I lib/platform/esp32/drivers
    -I lib/platform/esp32/repositories

build_unflags = -std=gnu++11

monitor_speed = 115200
upload_speed = 921600
lib_ldf_mode = deep

lib_deps =
    Adafruit PN532 @ ^1.3.3
    miguelbalboa/MFRC522 @ ^1.4.10
    olikraus/U8g2 @ ^2.35.7
    bblanchon/ArduinoJson @ ^7.0.4
    platform
    shared

; --- ESP32-S3 (Xtensa Dual-Core 240MHz + On-Chip USB CDC) ---
[env:esp32_s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=4
    -DLOG_LEVEL=4
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -I lib/interfaces
    -I lib/shared/models
    -I lib/shared/utils
    -I lib/application
    -I lib/config
    -I lib/platform/esp32/config
    -I lib/platform/esp32/drivers
    -I lib/platform/esp32/repositories

build_unflags = -std=gnu++11

monitor_speed = 115200
upload_speed = 921600
lib_ldf_mode = deep

lib_deps =
    Adafruit PN532 @ ^1.3.3
    miguelbalboa/MFRC522 @ ^1.4.10
    olikraus/U8g2 @ ^2.35.7
    bblanchon/ArduinoJson @ ^7.0.4
    platform
    shared

