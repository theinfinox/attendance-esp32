; =============================================================================
; 2. STM32 Family (Dedicated USB Serial CLI + MicroSD Card Storage)
; =============================================================================

; --- STM32F401CE BlackPill (WeAct V3.0) ---
[env:stm32_blackpill]
platform = ststm32
board = blackpill_f401ce
framework = arduino

build_flags =
    -std=gnu++17
    -DLOG_LEVEL=4
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -I lib/interfaces
    -I lib/shared/models
    -I lib/shared/utils
    -I lib/application
    -I lib/config
    -I lib/platform/stm32/config
    -I lib/platform/stm32/drivers
    -I lib/platform/stm32/repositories

build_unflags = -std=gnu++11

monitor_speed = 115200
lib_ldf_mode = deep

lib_deps =
    Adafruit PN532 @ ^1.3.3
    miguelbalboa/MFRC522 @ ^1.4.10
    olikraus/U8g2 @ ^2.35.7
    bblanchon/ArduinoJson @ ^7.0.4
    arduino-libraries/SD @ ^1.3.0
    platform
    shared

